name: Publish to npm

# Manual only: publishing is a decision, not a side effect of pushing a tag.
# Run it from the Actions tab after the release tag exists.
#
# What it adds over `npm publish` from a laptop: npm provenance. The registry
# records, and verifies, that this exact tarball was built from this repo at this
# commit by this workflow - a signed link from published bytes back to source.
#
# Two ways to authenticate, in order of preference:
#
# By default the workflow *stages* the release instead of publishing it: the
# tarball is built, signed and uploaded, and a human approves it afterwards on
# npmjs.com or with `npm stage approve`. That is npm's recommended posture and
# it means a compromised workflow still cannot ship a version on its own. Pass
# `direct: true` only if the trusted publisher has "Allow npm publish" enabled.
#
# 1. Trusted publishing (OIDC), no secret at all. On npmjs.com: the package ->
#    Settings -> Trusted publisher -> GitHub Actions, with this repository and
#    this workflow's filename. npm then trusts a short-lived OIDC token minted by
#    Actions for this exact workflow. This is also the route npm is pushing
#    everyone towards: tokens that bypass 2FA are being restricted for direct
#    publishing from January 2027.
# 2. An npm *automation* token in the repository secret NPM_TOKEN
#    (npmjs.com -> Access Tokens -> Granular, read+write on @gipsic/claude-usage).
#    Used automatically if the secret exists; nothing else to change.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v1.1.0)'
        required: true
      dry_run:
        description: 'Pack only, do not publish or stage'
        type: boolean
        default: false
      direct:
        description: 'Publish straight to the registry instead of staging for approval'
        type: boolean
        default: false
      github_packages:
        description: 'Also publish to GitHub Packages (npm.pkg.github.com)'
        type: boolean
        default: true
      npm_registry:
        description: 'Publish to npmjs.org (turn off to re-run only the GitHub Packages mirror)'
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write        # required for provenance

jobs:
  publish:
    if: ${{ inputs.npm_registry }}
    runs-on: ubuntu-latest
    env:
      # `secrets` cannot be read inside an `if:`, so the decision is made here.
      HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing needs npm 11.5.1 or newer; Node 22 ships npm 10.
      - name: npm 11
        run: npm install -g npm@latest && npm --version

      # Never publish something that is not green, and never publish a tarball
      # whose version does not match the tag being released.
      - run: npm test
      - name: version matches the tag
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          [ "$PKG" = "${{ inputs.tag }}" ] || { echo "package.json is $PKG but the tag is ${{ inputs.tag }}"; exit 1; }

      - run: npm pack --dry-run

      # Default: stage rather than publish. The trusted publisher is configured
      # with "Allow npm publish" off, which is npm's recommendation - CI builds
      # and signs the tarball, a human approves it, and a compromised workflow
      # cannot put a version on the registry by itself.
      - name: stage for approval (trusted publishing)
        if: ${{ !inputs.dry_run && !inputs.direct && env.HAS_NPM_TOKEN != 'true' }}
        run: |
          npm stage publish --provenance --access public
          {
            echo "### Staged, waiting for approval"
            echo
            echo 'Approve it on npmjs.com (package -> Settings -> Staged), or:'
            echo
            echo '```'
            echo 'npm stage list @gipsic/claude-usage'
            echo 'npm stage approve <stage-id>'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Only when the trusted publisher is allowed to publish directly, or a
      # token is configured. Provenance is recorded either way.
      - name: publish (trusted publishing)
        if: ${{ !inputs.dry_run && inputs.direct && env.HAS_NPM_TOKEN != 'true' }}
        run: npm publish --provenance --access public

      - name: publish (automation token)
        if: ${{ !inputs.dry_run && env.HAS_NPM_TOKEN == 'true' }}
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # A mirror on GitHub Packages, so the package shows on the repository and an
  # org can install it from the same place as the source. It is a mirror, not a
  # replacement: GitHub Packages requires every consumer to authenticate, even
  # for a public package, so npmjs.org stays the documented install path.
  #
  # No provenance here - attestations are an npmjs.org feature - and no secret:
  # GITHUB_TOKEN with packages:write is enough.
  github-packages:
    if: ${{ inputs.github_packages && !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://npm.pkg.github.com'
          scope: '@gipsic'
      - name: version matches the tag
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          [ "$PKG" = "${{ inputs.tag }}" ] || { echo "package.json is $PKG but the tag is ${{ inputs.tag }}"; exit 1; }
      - run: npm publish --registry=https://npm.pkg.github.com
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
