name: Feature request
description: Something the tool should do
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes: { label: The problem, description: What are you trying to see or do? }
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes: { label: Proposed change, description: Optional. Screenshots or mockups welcome. }
  - type: checkboxes
    id: constraints
    attributes:
      label: Fits the project's constraints?
      options:
        - label: Keeps zero npm dependencies (or explains why one is unavoidable)
        - label: Sends no data anywhere except api.anthropic.com / status.anthropic.com
